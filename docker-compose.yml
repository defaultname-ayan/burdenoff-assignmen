services:
  postgres:
    image: postgres:16-alpine
    container_name: sla_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sla
      POSTGRES_PASSWORD: sla
      POSTGRES_DB: sla_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla -d sla_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: sla_tracker_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: sla
      POSTGRES_PASSWORD: sla
      POSTGRES_DB: sla_tracker_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla -d sla_tracker_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
